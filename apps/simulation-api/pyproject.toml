[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opstwin-simulation-api"
version = "0.7.0"
description = "Validated operational simulation, sensitivity, and explicit economic comparison service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "simpy==4.1.1",
  "uvicorn==0.35.0"
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "httpx==0.28.1",
  "jsonschema==4.25.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
ignore_missing_imports = true

[tool.vercel]
entrypoint = "app.main:app"
