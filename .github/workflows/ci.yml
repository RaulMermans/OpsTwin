name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Bootstrap locked dependencies
        run: pnpm bootstrap

      - name: Verify repository with analytical, repeated, and comparison smoke checks
        run: pnpm verify
